# Failure Mode Catalog — see docs/eval.md §12.
# Edit this file and re-run `mix run priv/repo/seeds.exs` to sync.

- slug: max_steps_exceeded
  name: "ReAct loop exhausted step budget"
  failure_type: planning
  severity: medium
  trigger_condition: "Runtime iteration count reaches the card's reasoning_policy.max_steps without producing a final answer."
  example: "Agent keeps retrying web_search → http_fetch with no convergence."
  expected_recovery: "Increase max_steps in the card, redesign the task to need fewer hops, or add a stronger summarisation reflection."
  detection_method: "auto: reason matches {:max_steps_exceeded, _}"
  related_test_cases: []

- slug: llm_empty_response
  name: "LLM returned no content or tool call"
  failure_type: llm
  severity: medium
  trigger_condition: "Provider responded with finish_reason but neither textual content nor a tool_calls array."
  example: "Reasoning model produced only an internal trace that the adapter filtered out."
  expected_recovery: "Retry once; if persistent, lower max_completion_tokens or switch deployment."
  detection_method: "auto: reason matches {:empty_response, _}"
  related_test_cases: []

- slug: llm_missing_config
  name: "Azure OpenAI adapter not configured"
  failure_type: llm
  severity: high
  trigger_condition: "One of AZURE_OPENAI_ENDPOINT / AZURE_OPENAI_API_KEY / AZURE_OPENAI_DEPLOYMENT is missing at request time."
  example: "Server started without ./run.sh; chat surface returns {:missing_config, :api_key}."
  expected_recovery: "Set the env vars (see ./run.sh) and restart."
  detection_method: "auto: reason matches {:llm_error, {:missing_config, _}}"
  related_test_cases: []

- slug: llm_http_4xx
  name: "LLM HTTP 4xx (client error)"
  failure_type: llm
  severity: high
  trigger_condition: "Provider returned a 4xx status — bad request, unauthorized, or rate limit (429)."
  example: "gpt-5.3-chat rejected temperature=0.2 with unsupported_value."
  expected_recovery: "Inspect response body for the model's error code. Adjust adapter parameters or back off on 429."
  detection_method: "auto: reason matches {:llm_error, {:http_error, 4xx, _}}"
  related_test_cases: []

- slug: llm_http_5xx
  name: "LLM HTTP 5xx (server error)"
  failure_type: llm
  severity: medium
  trigger_condition: "Provider returned a 5xx status — internal failure or upstream timeout."
  example: "Azure backend transient 503."
  expected_recovery: "Retry with exponential backoff; check provider status page."
  detection_method: "auto: reason matches {:llm_error, {:http_error, 5xx, _}}"
  related_test_cases: []

- slug: llm_http_other
  name: "LLM HTTP unexpected status"
  failure_type: llm
  severity: low
  trigger_condition: "Provider returned a non-2xx status outside the 4xx/5xx ranges."
  example: "3xx redirect not followed."
  expected_recovery: "Add the status to the adapter's allowed list or follow redirects."
  detection_method: "auto: reason matches {:llm_error, {:http_error, _, _}} with status outside 400–599"
  related_test_cases: []

- slug: llm_transport_error
  name: "LLM network/transport error"
  failure_type: infrastructure
  severity: medium
  trigger_condition: "Req could not complete the HTTP exchange — DNS failure, TLS error, broken pipe, or timeout."
  example: "Local firewall blocks api.openai.azure.com."
  expected_recovery: "Verify network reachability, DNS, and Azure endpoint; retry."
  detection_method: "auto: reason matches {:llm_error, {:transport_error, _}}"
  related_test_cases: []

- slug: llm_malformed_response
  name: "Adapter could not parse LLM response"
  failure_type: llm
  severity: medium
  trigger_condition: "Provider returned 200 OK but the body shape didn't match the expected `choices` schema."
  example: "Streaming response leaked into the non-streaming adapter."
  expected_recovery: "Inspect raw payload; tighten adapter response parser."
  detection_method: "auto: reason matches {:llm_error, {:malformed_response, _}}"
  related_test_cases: []

- slug: llm_other
  name: "Unclassified LLM error"
  failure_type: llm
  severity: low
  trigger_condition: "An :llm_error tuple was produced that didn't match any known pattern."
  example: "New error shape introduced by an adapter change."
  expected_recovery: "Inspect the reason and add a more specific catalog entry + Detector clause."
  detection_method: "auto: fallback for {:llm_error, _}"
  related_test_cases: []

- slug: sub_agent_failed
  name: "Delegated sub-agent failed"
  failure_type: planning
  severity: medium
  trigger_condition: "A `delegate` tool call produced a sub-agent that ended in :failed."
  example: "Sub-agent hit its own max_steps without solving the sub-task."
  expected_recovery: "Inspect the sub-run trace; adjust the skill body, the sub-agent's tool allow-list, or its max_steps."
  detection_method: "auto: reason matches {:sub_agent_failed, _}"
  related_test_cases: []

- slug: tool_unknown
  name: "Model called a tool that is not registered"
  failure_type: tool
  severity: medium
  trigger_condition: "Tool name from the LLM response is not present in the Tools.Registry table."
  example: "Model hallucinates a tool name like `database_query` that was never registered."
  expected_recovery: "Register the missing tool, update the model's system prompt to list only available tools, or tighten tool_choice."
  detection_method: "auto: tool error matches {:unknown_tool, _}"
  related_test_cases: []

- slug: tool_invalid_input
  name: "Tool call rejected by JSON Schema validation"
  failure_type: tool
  severity: low
  trigger_condition: "Arguments produced by the LLM do not satisfy the tool's input_schema."
  example: "memory_search call without a `query` field."
  expected_recovery: "Often self-corrects in the next turn after the model sees the validation error. Persistent failures suggest a schema/model mismatch."
  detection_method: "auto: tool error matches {:invalid_input, _}"
  related_test_cases: []

- slug: tool_crash
  name: "Tool implementation raised or threw"
  failure_type: tool
  severity: high
  trigger_condition: "Tool's `call/1` raised an exception or threw a non-exception value."
  example: "HttpFetch crashes on a malformed URL the schema didn't reject."
  expected_recovery: "Patch the tool to return `{:error, reason}` instead of raising. Add a regression test."
  detection_method: "auto: tool error matches {:tool_crash, _} or {:tool_throw, _}"
  related_test_cases: []

- slug: tool_schema_error
  name: "Tool input schema failed to compile"
  failure_type: tool
  severity: critical
  trigger_condition: "ExJsonSchema.Schema.resolve/1 raised while validating tool input — typically a malformed schema."
  example: "Hand-edited tool module produced an invalid JSON Schema."
  expected_recovery: "Fix the schema. Until then the tool is effectively unusable."
  detection_method: "auto: tool error matches {:schema_error, _}"
  related_test_cases: []

- slug: tool_timeout
  name: "Tool exceeded its execution budget"
  failure_type: tool
  severity: medium
  trigger_condition: "A tool result contained 'timed out' / 'timeout' in its error string."
  example: "PythonExec ran a busy loop past --timeout_ms."
  expected_recovery: "Lower complexity, raise the timeout, or split the task."
  detection_method: "auto: binary error matches /timed? out/i"
  related_test_cases: []

- slug: tool_denied
  name: "Tool call denied by human-in-the-loop"
  failure_type: policy
  severity: low
  trigger_condition: "An approval row was resolved with status `denied`."
  example: "User declined a memory_store call that fabricated a fact."
  expected_recovery: "Expected outcome — recorded so refusal patterns are visible. Investigate if denials are unexpected."
  detection_method: "auto: binary error contains 'denied by user'"
  related_test_cases: []

- slug: tool_network_error
  name: "Tool failed due to network/transport"
  failure_type: infrastructure
  severity: medium
  trigger_condition: "Tool error string mentions network, DNS, ECONNREFUSED, NXDOMAIN, etc."
  example: "web_search couldn't reach DuckDuckGo Instant Answer endpoint."
  expected_recovery: "Check egress / firewall / DNS. Retry with backoff."
  detection_method: "auto: binary error matches /network|connection|econnref|nxdomain/i"
  related_test_cases: []

- slug: workflow_violation
  name: "Planner stepped outside the card's workflow graph"
  failure_type: policy
  severity: high
  trigger_condition: "A status transition that the card's `workflow_graphs[0].transitions` does not list, while the graph is in `enforce: true` mode."
  example: "Reasoning step skipped `planning` and jumped directly to `acting` when only `planning → acting` is allowed."
  expected_recovery: "Loosen the graph (add the transition) or fix the runtime path. Until then this run halts to prevent unintended actions."
  detection_method: "auto: reason matches {:workflow_violation, _, _}"
  related_test_cases: []

- slug: user_cancelled
  name: "Run cancelled by the user"
  failure_type: policy
  severity: low
  trigger_condition: "An operator pressed Cancel in ChatLive (or called Runtime.cancel/1)."
  example: "User noticed the agent heading the wrong way and stopped it before tool calls completed."
  expected_recovery: "Expected outcome — recorded so cancel rates are visible. Frequent cancels suggest the prompt or skill needs refinement."
  detection_method: "auto: reason is :user_cancelled"
  related_test_cases: []

- slug: reflexion_failed
  name: "Self-critique call failed silently"
  failure_type: planning
  severity: low
  trigger_condition: "Agent.Reflexion.critique/1 returned :error (transport, missing config, or empty response). The run continues without the critique."
  example: "Critic adapter was temporarily down; the planner missed one reflexion injection."
  expected_recovery: "Investigate adapter logs; reflexion is advisory and skipping it does not break correctness. Catalog this for visibility only — no occurrence is auto-recorded today."
  detection_method: "manual / log-grep (no auto-classifier yet)"
  related_test_cases: []

- slug: tot_failed
  name: "Tree-of-Thoughts brainstorm failed"
  failure_type: planning
  severity: low
  trigger_condition: "Agent.ToT.brainstorm/1 returned :error (malformed JSON, transport, or empty)."
  example: "Model emitted markdown-fenced JSON the parser didn't strip; ToT.brainstorm returned {:malformed_plan_json, _}."
  expected_recovery: "Inspect the raw model output. ToT is advisory — the planner falls back to plain ReAct on failure."
  detection_method: "manual / log-grep (no auto-classifier yet)"
  related_test_cases: []

- slug: tool_precheck_failed
  name: "Tool precondition not satisfied"
  failure_type: tool
  severity: medium
  trigger_condition: "A tool's precheck/1 returned {:error, reason} before call/1 ran. Typically: required config missing, prerequisite resource unavailable."
  example: "memory_search invoked without AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT set."
  expected_recovery: "Resolve the precondition (set the env, mount the dependency). The model's next turn will see the precheck error and can choose another tool."
  detection_method: "auto: tool error matches {:precheck_failed, _}"
  related_test_cases: []
