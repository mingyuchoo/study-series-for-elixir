slug: default
name: General Research Assistant
role: |
  You are a general-purpose research agent that decomposes a user's request
  into sub-tasks, calls tools when needed, and synthesizes a grounded answer.
goal: |
  Produce a correct, concise answer to the user's question, citing any
  external information retrieved via tools.
scope: |
  - Allowed: web search, HTTP GET on public URLs, arithmetic.
  - Disallowed: code execution, file system writes, sending email,
    actions on user accounts.
capabilities:
  inputs: [text]
  outputs: [text]
  languages: [en, ko]
tool_policy:
  allow: [web_search, http_fetch, calculator, memory_search, memory_store, delegate, python_exec]
  deny: []
  max_tool_calls_per_run: 8
  parallel_tool_calls: false
reasoning_policy:
  framework: react
  max_steps: 12
  reflection: true
  # Planning strategy: "react" (default, linear) or "tot" (depth-1 tree of
  # thoughts: generate 3 candidates per turn, self-rate, pick the best).
  planning_strategy: react
  # Reflexion: every N iterations, ask the model to critique its own
  # trajectory and inject the critique into the next planning turn.
  reflexion:
    enabled: true
    every_n: 2
    max_reflections: 4
  # Auto-RAG: every turn the runtime queries long-term memory with the
  # latest user message and prepends top-k results as a system message.
  retrieval:
    enabled: true
    k: 5
    min_score: 0.0
    query_source: last_user
safety_policy:
  pii_handling: redact
  refuse_topics: [violent_wrongdoing, malware_authoring, csam]
  # Any tool whose risk_level is in this list, OR whose name is in this list,
  # pauses the run until a human decides.
  human_approval_required_for: [high, critical, memory_store]
output_contract:
  format: markdown
  must_include: [answer]
  may_include: [citations, caveats]
evaluation_mapping:
  golden_dataset: priv/eval/golden/default.jsonl
  rubric:
    correctness: 0.4
    completeness: 0.2
    tool_use_quality: 0.2
    safety: 0.1
    efficiency: 0.1
  pass_threshold: 0.7
metadata:
  version: "0.1.0"
  owner: mingyuchoo

task_taxonomies:
  - task_type: factual_qa
    domain: general
    complexity: low
    risk_level: low
    required_tools: [web_search, http_fetch]
    success_criteria: |
      Answer is factually grounded in retrieved sources and addresses the
      user's specific question.
  - task_type: arithmetic
    domain: math
    complexity: low
    risk_level: low
    required_tools: [calculator]
    success_criteria: |
      Numerical answer matches reference within rounding tolerance.
  - task_type: multistep_research
    domain: general
    complexity: medium
    risk_level: low
    required_tools: [web_search, http_fetch]
    success_criteria: |
      Plan covers all sub-questions; final answer integrates evidence
      from at least two distinct sources.

capability_matrix:
  supported_capabilities:
    - tool_use
    - reflection
    - multi_step_plan
  supported_inputs: [text]
  supported_outputs: [markdown]
  required_tools: [web_search, http_fetch, calculator]
  constraints: |
    No long-term memory in v0.1. No code execution. No write actions.
  known_limitations: |
    Cannot access paywalled or authenticated content. Web search relies on
    public endpoints and may rate-limit.

workflow_graphs:
  - name: default_react_loop
    states:
      idle:
        description: Waiting for a user message.
      planning:
        description: Produce or revise a plan via the LLM.
      acting:
        description: Issue tool calls returned by the LLM.
      observing:
        description: Feed tool outputs back to the LLM.
      reflecting:
        description: Decide whether the goal is satisfied or replan.
      awaiting_approval:
        description: Paused for human-in-the-loop approval on a risky action.
      done:
        description: Final answer produced.
      failed:
        description: Unrecoverable error.
    transitions:
      idle: [planning]
      planning: [acting, done]
      acting: [observing, awaiting_approval]
      observing: [reflecting]
      reflecting: [planning, done, failed]
      awaiting_approval: [acting, failed]
    terminal_states: [done, failed]
    approval_points: [awaiting_approval]
