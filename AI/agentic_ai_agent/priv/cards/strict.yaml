slug: strict
name: Strict Workflow Demo
role: |
  Read-only researcher that may search the web and the long-term memory,
  but must never execute code, modify memory, or fan out into sub-agents.
goal: |
  Demonstrate a workflow that enforces a hard tool-allowlist per state.
scope: |
  Read-only access. No mutating tools. Useful as a baseline for HITL +
  compliance scenarios.

capabilities:
  inputs: [text]
  outputs: [text]
  languages: [en, ko]

tool_policy:
  allow: [web_search, http_fetch, memory_search]
  deny: [python_exec, memory_store, delegate]
  max_tool_calls_per_run: 6
  parallel_tool_calls: false

reasoning_policy:
  framework: react
  max_steps: 8
  reflection: true
  planning_strategy: react
  reflexion:
    enabled: true
    every_n: 2
    max_reflections: 2

safety_policy:
  human_approval_required_for: []

output_contract:
  format: markdown
  cite_sources: true

evaluation_mapping:
  golden_dataset: priv/eval/golden/default.jsonl
  rubric:
    correctness: 0.4
    completeness: 0.2
    tool_use_quality: 0.2
    safety: 0.1
    efficiency: 0.1
  pass_threshold: 0.7

task_taxonomies:
  - task_type: general_qa
    domain: general
    complexity: low
    risk_level: low
    required_tools: [web_search]
    success_criteria: Answer cites at least one web source.

capability_matrix:
  supported_capabilities: [tool_use, multi_step_plan]
  supported_inputs: [text]
  supported_outputs: [markdown]
  required_tools: [web_search, http_fetch, memory_search]
  constraints: Read-only.
  known_limitations: No memory writes. No code execution. No sub-agents.

workflow_graphs:
  - name: strict_react
    # enforce: true → invalid transitions abort the run with
    # {:workflow_violation, from, to}; tool calls not in allowed_actions
    # for the current state are rejected with {:error, "workflow_violation: ..."}.
    enforce: true
    states:
      idle: { description: Waiting for user input. }
      planning: { description: LLM planning. }
      acting: { description: Dispatching tool calls. }
      observing: { description: Reading tool results. }
      reflecting: { description: Decide replan vs finish. }
      awaiting_approval: { description: HITL gate. }
      done: { description: Finished. }
      failed: { description: Unrecoverable. }
    transitions:
      idle: [planning]
      planning: [acting, done]
      acting: [observing, awaiting_approval]
      observing: [reflecting]
      reflecting: [planning, done, failed]
      awaiting_approval: [acting, failed]
    terminal_states: [done, failed]
    approval_points: [awaiting_approval]
    # Hard tool allowlist per state. Tools NOT listed for a state are
    # rejected at dispatch. Use the wildcard "*" to mean "any tool".
    allowed_actions:
      acting: [web_search, http_fetch, memory_search]

metadata:
  agent_avatar_path: "/images/avatars/avatar-02.png"
  agent_avatar_options:
    - "/images/avatars/avatar-01.png"
    - "/images/avatars/avatar-02.png"
